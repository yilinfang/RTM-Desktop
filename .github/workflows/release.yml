name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Apple Silicon DMG
    runs-on: macos-latest
    env:
      APP_NAME: RTM
      APP_URL: https://www.rememberthemilk.com/app/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build app
        run: |
          pake "$APP_URL" \
            --name "$APP_NAME" \
            --app-version "${{ steps.version.outputs.version }}" \
            --targets apple

      - name: Rename DMG
        id: dmg
        run: |
          src=$(find . -maxdepth 1 -name "*.dmg" | head -n 1)
          if [ -z "$src" ]; then
            echo "No DMG found" >&2
            exit 1
          fi
          dest="${APP_NAME}_${{ steps.version.outputs.version }}_aarch64.dmg"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.path }}
          generate_release_notes: true
