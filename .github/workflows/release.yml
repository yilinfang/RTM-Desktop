name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Apple Silicon DMG
    runs-on: macos-latest
    env:
      APP_NAME: RTM
      APP_URL: https://www.rememberthemilk.com/app/
      PAKE_VERSION: 3.17.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Calendar version YEAR.MONTH.RELEASE (as mise does): RELEASE counts releases
          # within the month from 0. No leading zeros, so it stays valid semver for Tauri
          if ! [[ "$version" =~ ^[0-9]{4}\.[1-9][0-9]?\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must be vYEAR.MONTH.RELEASE without leading zeros (e.g. v2026.10.0), got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Pake CLI
        run: npm install -g "pake-cli@$PAKE_VERSION"

      - name: Build app
        run: |
          pake "$APP_URL" \
            --name "$APP_NAME" \
            --app-version "${{ steps.version.outputs.version }}" \
            --targets apple

      - name: Rename DMG
        id: dmg
        run: |
          src=$(find . -maxdepth 1 -name "*.dmg" | head -n 1)
          if [ -z "$src" ]; then
            echo "No DMG found" >&2
            exit 1
          fi
          dest="${APP_NAME}_${{ steps.version.outputs.version }}_aarch64.dmg"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        id: notes
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Build info"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Build time | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| Pake | V${PAKE_VERSION} |"
            echo "| Commit | ${GITHUB_SHA::7} |"
            echo "| Rust | $(rustc --version | cut -d' ' -f2) |"
            echo "| Node.js | $(node --version) |"
            echo "| macOS runner | $(sw_vers -productVersion) |"
          } > "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.path }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
